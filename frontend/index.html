<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GoWild Pass Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>✈ GoWild Pass Finder</h1>
      <p>Find $16 Frontier flights and book instantly</p>
    </header>

    <section class="search-box">
      <div class="row">
        <div class="field">
          <label>From (airport code)</label>
          <input id="origin" type="text" placeholder="e.g. CVG" maxlength="3" />
        </div>
        <div class="field">
          <label>To (airport code)</label>
          <input id="destination" type="text" placeholder="e.g. ATL" maxlength="3" />
        </div>
        <div class="field">
          <label>Date</label>
          <input id="date" type="date" />
        </div>
      </div>
      <button id="searchBtn" onclick="searchFlights()">Search Flights</button>
    </section>

    <section id="status" class="status hidden"></section>

    <section id="airport-info" class="airport-info hidden">
      <p id="airport-text"></p>
    </section>

    <section id="results" class="results hidden">
      <h2>Available GoWild Flights</h2>
      <div id="flight-list"></div>
    </section>

    <div id="confirm-modal" class="modal hidden">
      <div class="modal-box">
        <h2>Confirm Booking</h2>
        <p id="confirm-text"></p>
        <div class="modal-actions">
          <button class="btn-confirm" onclick="confirmBook()">Yes, Book It</button>
          <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
